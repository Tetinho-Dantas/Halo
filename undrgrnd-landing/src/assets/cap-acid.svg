<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <filter id="grain" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="saturate" values="0" />
      <feBlend mode="overlay" in2="SourceGraphic" />
    </filter>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#eaff33" />
      <stop offset="100%" stop-color="#b7ff00" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0A0A0A" />

  <!-- cap crown -->
  <path d="M150 420 C200 200, 1000 200, 1050 420 L1050 480 C1050 520, 200 520, 150 480 Z"
        fill="url(#g1)" stroke="#000000" stroke-opacity="0.25" stroke-width="6" />

  <!-- brim -->
  <ellipse cx="600" cy="520" rx="480" ry="140" fill="#070707" />
  <ellipse cx="600" cy="520" rx="420" ry="110" fill="#0E0E0E" />

  <!-- highlight -->
  <path d="M220 420 Q600 260 980 420" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="30" stroke-linecap="round" />

  <!-- brand text -->
  <text x="50%" y="420" text-anchor="middle" fill="#0A0A0A" font-family="Anton, Arial, sans-serif" font-size="92" font-weight="700" style="letter-spacing:6px">NEM ERA</text>

  <!-- small tag -->
  <rect x="860" y="300" width="170" height="54" rx="10" fill="#0A0A0A" opacity="0.7" />
  <text x="945" y="335" text-anchor="middle" fill="#eaff33" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">LIMITED</text>

  <!-- grain (subtle) -->
  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.03" />