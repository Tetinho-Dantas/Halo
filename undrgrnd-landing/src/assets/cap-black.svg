<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <filter id="grain2" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#070707" />

  <!-- crown -->
  <path d="M160 410 C210 210, 990 210, 1040 410 L1040 480 C1040 520, 210 520, 160 480 Z"
        fill="#0B0B0B" stroke="#ffffff" stroke-opacity="0.03" stroke-width="4" />

  <!-- stitched seam -->
  <path d="M220 420 Q600 310 980 420" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="12" stroke-dasharray="8 10" />

  <!-- brim layers -->
  <ellipse cx="600" cy="520" rx="480" ry="140" fill="#050505" />
  <ellipse cx="600" cy="520" rx="440" ry="120" fill="#111111" />

  <!-- logo text (subtle bright) -->
  <text x="50%" y="420" text-anchor="middle" fill="#EDEDED" font-family="Anton, Arial, sans-serif" font-size="86" font-weight="700" style="letter-spacing:4px">NEM ERA</text>

  <!-- distressed stencil mark -->
  <g opacity="0.14" fill="#EDEDED">
    <rect x="520" y="360" width="18" height="6" />
    <rect x="680" y="360" width="16" height="5" />
  </g>

  <rect width="100%" height="100%" filter="url(#grain2)" opacity="0.04" />
</svg>